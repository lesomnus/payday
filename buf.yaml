version: v2
modules:
  - path: ./proto
    name: buf.build/payday/payday
  # The app payday is tried against. It is a module of its own so that it can
  # depend on `orm` the way an app does, and so that what is generated for it
  # is generated the way an app's is.
  - path: ./internal/apptest/proto
    excludes:
      # The overlays: fragments handed to protobuf-merge by path, naming types
      # that exist only after the merge. buf must not try to compile them.
      - internal/apptest/proto/ext
deps:
  - buf.build/orm/orm
  - buf.build/patch/patch
lint:
  use:
    - STANDARD
  except:
    # payday is versioned by the module it ships in, not by its package name.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # The extension declaration sits beside the package it extends, which is
    # how `orm` does it too.
    - PACKAGE_SAME_DIRECTORY

    # The service contracts are generated from the entities: a request is named
    # after the entity it is about and the answer is the entity itself. That is
    # the whole shape of the stack, and it is not what buf expects of a service
    # somebody wrote by hand.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
  # The times payday keeps under names of their own are `date_*`, as every
  # other is (2026-11-08): an event's, a fact's, a copied entitlement's, a
  # grant's window and a token's end, and the test app's own. The same numbers,
  # so the binary wire is the one it was, and a JSON client reads the new
  # names -- but in the test app's event messages, which keep the JSON name
  # their rows were written with, as the past's lock holds them to. Remove once
  # main and buf.build/payday/payday:dev have it.
  ignore_only:
    FIELD_SAME_NAME:
      - proto/payday/grant.proto
      - proto/payday/token.proto
      - internal/apptest/proto/app/machine.proto
      - internal/apptest/proto/app/payday/entitlement.proto
      - internal/apptest/proto/app/payday/event.proto
      - internal/apptest/proto/app/payday/event_svc.g.proto
      - internal/apptest/proto/app/payday/fact.proto
      - internal/apptest/proto/app/payday/fact_svc.g.proto
      - internal/apptest/proto/app/stint.proto
      - internal/apptest/proto/app/stint_svc.g.proto
    FIELD_SAME_JSON_NAME:
      - proto/payday/grant.proto
      - proto/payday/token.proto
      - internal/apptest/proto/app/payday/entitlement.proto
      - internal/apptest/proto/app/payday/event.proto
      - internal/apptest/proto/app/payday/event_svc.g.proto
      - internal/apptest/proto/app/payday/fact.proto
      - internal/apptest/proto/app/payday/fact_svc.g.proto
      - internal/apptest/proto/app/stint.proto
      - internal/apptest/proto/app/stint_svc.g.proto

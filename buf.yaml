version: v2
modules:
  - path: ./proto
    name: buf.build/payday/payday
  # The app payday is tried against. It is a module of its own so that it can
  # depend on `orm` the way an app does, and so that what is generated for it
  # is generated the way an app's is.
  - path: ./internal/apptest/proto
    excludes:
      # The overlays: fragments handed to protobuf-merge by path, naming types
      # that exist only after the merge. buf must not try to compile them.
      - internal/apptest/proto/ext
deps:
  - buf.build/orm/orm
  - buf.build/patch/patch
lint:
  use:
    - STANDARD
  except:
    # payday is versioned by the module it ships in, not by its package name.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # The extension declaration sits beside the package it extends, which is
    # how `orm` does it too.
    - PACKAGE_SAME_DIRECTORY

    # The service contracts are generated from the entities: a request is named
    # after the entity it is about and the answer is the entity itself. That is
    # the whole shape of the stack, and it is not what buf expects of a service
    # somebody wrote by hand.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
  # Until the first app launches, payday keeps nothing for an earlier payday
  # (2026-11-09). A moment is named for its event in the past tense, so a
  # grant's, a token's and an entitlement's `date_expires` is `date_expired`,
  # at the same number: the field's name and its JSON name change, and nothing
  # reads the old ones. The registry holds payday's module and not the test
  # app's: remove once main and buf.build/payday/payday:dev both have it.
  #
  # And, once: the test app's entities name their verbs, and an `Apply` is
  # written only where one is asked for (protobuf-orm/protobuf-orm#4), so the
  # contracts generated for the entities that asked for none lose that RPC and
  # its request, and `Cell` its `Patch`. Out with the first change after this
  # reaches main.
  ignore_only:
    RPC_NO_DELETE:
      - internal/apptest/proto/app/job_svc.g.proto
      - internal/apptest/proto/app/machine_svc.g.proto
      - internal/apptest/proto/app/robot_svc.g.proto
      - internal/apptest/proto/app/seal_svc.g.proto
      - internal/apptest/proto/app/stint_svc.g.proto
    MESSAGE_NO_DELETE:
      - internal/apptest/proto/app/job_svc.g.proto
      - internal/apptest/proto/app/machine_svc.g.proto
      - internal/apptest/proto/app/robot_svc.g.proto
      - internal/apptest/proto/app/seal_svc.g.proto
      - internal/apptest/proto/app/stint_svc.g.proto
    FIELD_SAME_NAME:
      - proto/payday/grant.proto
      - proto/payday/token.proto
      - internal/apptest/proto/app/payday/entitlement.proto
    FIELD_SAME_JSON_NAME:
      - proto/payday/grant.proto
      - proto/payday/token.proto
      - internal/apptest/proto/app/payday/entitlement.proto

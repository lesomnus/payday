version: v2
modules:
  - path: ./proto
    name: buf.build/payday/payday
  # The app payday is tried against. It is a module of its own so that it can
  # depend on `orm` the way an app does, and so that what is generated for it
  # is generated the way an app's is.
  - path: ./internal/apptest/proto
deps:
  - buf.build/orm/orm
  - buf.build/patch/patch
lint:
  use:
    - STANDARD
  except:
    # payday is versioned by the module it ships in, not by its package name.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # The extension declaration sits beside the package it extends, which is
    # how `orm` does it too.
    - PACKAGE_SAME_DIRECTORY

    # The service contracts are generated from the entities: a request is named
    # after the entity it is about and the answer is the entity itself. That is
    # the whole shape of the stack, and it is not what buf expects of a service
    # somebody wrote by hand.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE

# The TypeScript half, staged for release.
#
# It stages rather than publishes: `npm stage publish` puts the tarball on the
# registry in a state nobody can install, and a person runs `npm stage approve`
# to make it real. That split is the point of doing this in CI at all --
# what a machine is good at is building the thing the same way every time, and
# what it must not be able to do on its own is put a version in front of
# everybody who depends on this.
#
# # Registering it
#
# npm publishes from here without a token, through OIDC -- so the trust is in
# **this file** rather than in a secret somebody has to rotate. On npmjs.com,
# under the package's Settings → Trusted publisher, name:
#
#	repository:   lesomnus/payday
#	workflow:     npm.yml
#	environment:  (none)
#
# The workflow filename is part of what npm checks, so renaming this file
# revokes it until the registration is changed to match.
name: npm

on:
  # A tag, because publishing is a decision and a decision has a name. `git tag
  # ts/v0.0.4 && git push --tags` is the whole of it, and the job below refuses
  # a tag that disagrees with `package.json` rather than staging the wrong
  # version under the right name.
  push:
    tags: ['ts/v*']

  # And by hand, for a re-run that failed on something other than the build.
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      # What OIDC needs, and the whole reason there is no token here.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # No `registry-url`, which is the one thing that has to be left out.
      #
      # It writes an `.npmrc` carrying `_authToken=${NODE_AUTH_TOKEN}`, and
      # with no such secret set that resolves to an empty token -- which npm
      # then *uses*, rather than noticing it has none and asking OIDC. What
      # that looks like is a publish that signs its provenance happily and then
      # answers `E401 ... your authentication token seems to be invalid`, which
      # names the one thing this workflow does not have.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing wants a recent CLI, and the runner's is older than
      # the one that speaks it.
      - run: npm install -g npm@latest

      - run: npm ci
        working-directory: ts

      # The tag says which version this is, and `package.json` says which
      # version it is. A release where those two disagree is one nobody can
      # find afterwards, so it is refused here rather than discovered later.
      - name: the tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ts
        run: |
          want="${GITHUB_REF_NAME#ts/v}"
          have="$(node -p 'require("./package.json").version')"
          if [ "$want" != "$have" ]; then
            echo "tag says $want and package.json says $have" >&2
            exit 1
          fi

      # `prepack` runs the check, the tests and the build, so what is staged is
      # what those passed on. It is named here anyway: a package that skipped
      # them because a flag changed would skip them silently.
      - run: npm run check
        working-directory: ts
      - run: npm test
        working-directory: ts

      # `--provenance` is the other half of what OIDC buys: the tarball carries
      # a signed statement of the commit and the workflow that built it, which
      # is checkable by anybody rather than trusted.
      # `--loglevel verbose`, because the OIDC helper swallows every way it can
      # fail -- a missing id token, a rejected exchange, a response without a
      # token -- and answers `undefined` to all of them. What the publish then
      # says is `ENEEDAUTH`, which is true and names nothing. The reason is one
      # `npm verb oidc` line away, and only at this level.
      - run: npm stage publish --provenance --loglevel verbose
        working-directory: ts

      - name: what is left to do
        run: |
          echo "Staged. It is not installable until somebody approves it:" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo 'npm stage list @lesomnus/payday' >> "$GITHUB_STEP_SUMMARY"
          echo 'npm stage approve <stage-id>' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

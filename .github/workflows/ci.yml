# One job, because there is one thing to say: does it build, does it pass, and
# is the generated code what the schema says.
#
# The third is the one worth having a machine for. The first two fail at a desk;
# a generated file that was not regenerated compiles perfectly and is wrong, and
# `pd gen --check` is the only thing that looks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes, so no job is given more than to read the checkout. It
# is said here rather than left to the repository's default, which is a setting
# nobody reviews.
permissions:
  contents: read

# Every job names its image rather than `ubuntu-latest`, so that the runner
# moves when this file says so and not on GitHub's schedule.
#
# And every action is named by the commit its version had when it was written
# here, with that version after it: a tag is moved by whoever can push to the
# action's repository, so a tag is code this file has never seen. Renovate
# moves the commit and the comment together (`helpers:pinGitHubActionDigests`,
# in the preset, `renovate/app.json`).
jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      # The whole history, because `buf breaking` below compares against the
      # branch tip and a shallow checkout has no ref to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      # The public notification contract is compiled without private storage
      # records. schema's tests keep it equal to what an app receives.
      - name: notification contract
        working-directory: docs/contracts/notify
        run: |
          buf format --diff --exit-code
          buf lint
          buf build

      # Two baselines, because payday's schema reaches apps two ways.
      #
      # `proto/` is fetched: an app declares `buf.build/payday/payday:dev` and
      # buf resolves it, so what an app has is whatever was last pushed and not
      # whatever is on main. That is the contract, and the BSR is the only place
      # that knows it.
      #
      # The entities in `schema/payday` are **copied** -- `pd gen` writes them
      # into the app -- so they are in no module anyone depends on. What covers
      # them is that `internal/apptest` is an app and its copies are in the
      # workspace: break a shipped entity, and the copy moves. `pd gen --check`
      # below is what keeps the copy honest enough for this to mean anything.
      #
      # `ref=origin/main` rather than `branch=main`: a pull request is checked
      # out detached and has no local `main`.
      #
      # A change that breaks the wire on purpose is a migration, and it fails
      # here. That is the point -- it should be argued for in a review rather
      # than noticed by an app. Push the baseline first, or say so in
      # buf.yaml's `breaking.ignore_only` for the one change, and take it out
      # once both baselines have it.
      #
      # Each file is checked in the module it belongs to (`--exclude-imports`):
      # apptest imports payday's schema, and checked again there as an import
      # it is out of reach of an exception made for payday's own module. And
      # the registry holds payday's module and nothing else, so that module is
      # what is compared with it.
      - run: buf breaking --against '.git#ref=origin/main' --exclude-imports
      - run: buf breaking proto --against buf.build/payday/payday:dev

      # Before the suite, because the suite ends by regenerating the app from
      # its schema and the TypeScript half of that needs the plugin. A run
      # without it is a run that says the generated code is fine having looked
      # at two thirds of it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix ts
      - run: npm ci --prefix internal/apptest/ts

      # Both modules, and then the app regenerated from its schema -- anything
      # that moves is something a commit did not carry. `internal/apptest` is a
      # module of its own, so `go test ./...` at the root does not reach it, and
      # it is where nearly every claim payday makes is actually demonstrated.
      #
      # One step rather than four, which is the point of the script: what CI
      # runs and what a desk runs are the same command, so a green run here
      # cannot mean something a green run there did not.
      - run: ./scripts/test.sh

      # And that payday still builds for the browser, which is a promise about
      # the runtime -- no file system, no listener, no network assumed -- that
      # is only kept by being checked.
      - run: GOOS=js GOARCH=wasm go build ./...

      # The workspace pattern above does not enter the app's separate module.
      - run: GOOS=js GOARCH=wasm go build -tags grpcnotrace -o /tmp/apptest.wasm ./wasm
        working-directory: internal/apptest

  # The same suite, on the database an app is actually deployed on.
  #
  # SQLite needs no server, which is why everything above uses it and why it
  # should stay that way -- a suite nobody can run without a database is a suite
  # nobody runs. But SQLite is permissive in the directions that hide mistakes:
  # it has no real types, it sorts NULLs the other way round, and its driver
  # turns a nil []byte into an empty blob where pgx sends SQL NULL.
  #
  # That last one was not hypothetical. The first time this suite met
  # PostgreSQL, ten tests failed on two NOT NULL columns the trail and the
  # outbox had been writing nil into since they were written. Everything payday
  # generates is SQL; a suite that has only ever run on SQLite has not seen the
  # statements it will issue.
  #
  # Both modules, as `scripts/test.sh` covers both above. The app is where the
  # generated SQL is issued; the root module is where the code that issues it
  # lives, and two of its tests are ones no other job can fail -- `pdtest.DB`
  # hands out a schema per test, which needs a server to mean anything, and
  # `watch/watchpg` skips itself entirely without one. Both tests existed;
  # neither had ever run.
  #
  # One job for the two rather than one each: the service, the checkout and the
  # toolchain are the same, and steps are sequential where jobs are not. That
  # matters more than it looks, because both modules exercise the broker over
  # `LISTEN`/`NOTIFY` and that channel is scoped to a **database** -- two runs
  # sharing this server would hear each other's writes and neither could tell.
  # Two steps rather than one command, so a failure names the module.
  #
  # `scripts/with-postgres.sh` is this at a desk: it provides the database and
  # runs the gate against it. Every nil this has caught was caught here rather
  # than there, which is one push later than it had to be.
  postgres:
    runs-on: ubuntu-26.04

    # Once, for both steps. The service publishes its port on the runner and the
    # steps run there, so the address is loopback rather than the service name.
    env:
      PDTEST_POSTGRES: postgres://app:app@127.0.0.1:5432/app?sslmode=disable

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        # Without this the container is up before the database accepts, and the
        # first test is the one that finds out.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - name: payday
        run: go test ./... -count=1
      - name: the app it is tried against
        run: go test ./... -count=1
        working-directory: internal/apptest

  # The keys in devices (#52), each against an emulator of its device.
  #
  # An adapter for a device is the code in payday most likely to compile, pass
  # every test a desk runs, and be wrong: the suite above has no HSM and no TPM,
  # so all it can say about one is that the URI parses. What goes wrong with a
  # device is the device's -- r and s where a verifier reads ASN.1, a session a
  # token dropped, a scheme a key was made with, a key Transit would hand out --
  # and only a device says so. Each of these is the real thing's protocol: a
  # PKCS #11 library, a TPM's command stream, Transit's HTTP API, KMS's.
  #
  # Every test skips itself without its emulator, which is why they are named
  # here rather than left to `scripts/test.sh`: a skip is a pass, and a run in
  # which every device test skipped is a run that says nothing about devices.
  #
  # - SoftHSM is a library, and the tests make their own tokens in a directory
  #   of their own (`SOFTHSM2_CONF`); `pkcs11-tool` makes a key the way an
  #   operator would.
  # - swtpm is a process, on a Unix socket, with its control socket beside it
  #   where tpm2-tools look for it (`<path>.ctrl`).
  # - Vault and OpenBao are one API in two codebases, and both are tried, since
  #   a deployment has one or the other and nothing keeps the two the same.
  # - local-kms is the KMS emulator that signs a digest as KMS does. LocalStack
  #   now wants an account, and moto hashes what it is told is a digest, which
  #   no signature it makes survives.
  #
  # `-p 1`, because both TPM packages share the one swtpm, which holds a few
  # objects at a time and has no resource manager to share them out.
  signers:
    runs-on: ubuntu-26.04

    env:
      PDTEST_SOFTHSM2: /usr/lib/softhsm/libsofthsm2.so
      PDTEST_SWTPM: /tmp/swtpm/sock
      PDTEST_VAULT: http://127.0.0.1:8200
      PDTEST_AWSKMS: http://127.0.0.1:8080

    services:
      vault:
        image: hashicorp/vault:2.1.2
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
        ports: ["8200:8200"]
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 2s
          --health-retries 30
      openbao:
        image: openbao/openbao:2.7.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ["8201:8200"]
        options: >-
          --health-cmd "bao status -address=http://127.0.0.1:8200"
          --health-interval 2s
          --health-retries 30
      kms:
        image: nsmithuk/local-kms:3.11.7
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: the emulators that are not containers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc swtpm swtpm-tools tpm2-tools
          mkdir -p /tmp/swtpm
          swtpm socket --tpm2 --daemon \
            --server type=unixio,path=/tmp/swtpm/sock \
            --ctrl type=unixio,path=/tmp/swtpm/sock.ctrl \
            --tpmstate dir=/tmp/swtpm --flags not-need-init,startup-clear
          # local-kms has no health check of its own to give the service.
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8080 && break; sleep 1; done

      - name: payday's
        run: go test -p 1 -count=1 ./config/... ./trail/...
      - name: and Transit on OpenBao
        run: go test -count=1 ./trail/trailvault/ ./config/signervault/
        env:
          PDTEST_VAULT: http://127.0.0.1:8201
      - name: and KMS, a module of its own
        run: go test -count=1 ./...
        working-directory: trail/trailawskms

  # The write-once claims (#61), against the storage that makes them: an S3
  # bucket with Object Lock in compliance mode, on MinIO, and the closest a
  # runner has to a WORM mount -- a tmpfs whose files are made immutable and
  # whose directories append-only as checkpoints are written into it, which
  # only root can do.
  #
  # Both tests skip themselves without what they are tried against, so each
  # step asks that its test ran: a skip is a pass.
  write-once:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # MinIO publishes no images of its own any more. Chainguard builds it
      # from source, and the tag it gives away is `latest`.
      - name: MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            --tmpfs /data:rw,uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=pdtest -e MINIO_ROOT_PASSWORD=pdtest-secret \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live && break; sleep 1; done

      - name: on an S3 bucket with Object Lock
        shell: bash
        env:
          PDTEST_S3_OBJECT_LOCK: http://pdtest:pdtest-secret@127.0.0.1:9000
        run: |
          go test -count=1 -run '^TestCheckpointsOnS3ObjectLock$' -v ./trail/ | tee "$RUNNER_TEMP/s3.out"
          grep -q -- '--- PASS: TestCheckpointsOnS3ObjectLock' "$RUNNER_TEMP/s3.out"

      - name: in a directory that keeps what it is given
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/trail.test" ./trail/
          sudo mkdir -p /mnt/worm
          sudo mount -t tmpfs tmpfs /mnt/worm
          sudo PDTEST_WRITE_ONCE_DIR=/mnt/worm "$RUNNER_TEMP/trail.test" \
            -test.run '^TestCheckpointsInADirectoryThatKeepsWhatItIsGiven$' -test.count 1 -test.v | tee "$RUNNER_TEMP/worm.out"
          grep -q -- '--- PASS: TestCheckpointsInADirectoryThatKeepsWhatItIsGiven' "$RUNNER_TEMP/worm.out"

  # A brand new app, generated and built.
  #
  # `internal/apptest` does not cover this: it was written by hand and has been
  # regenerated ever since, so what it checks is the generator against a schema
  # that already works. Nothing checked the **template** until this job, and the
  # entity it ships had a field on the wrong number for as long as the header
  # rule existed -- so `pd new` produced an app that failed on its first
  # generation, and every test in the repository passed.
  #
  # It replaces payday with this checkout, which is the point: the template is
  # held to the payday it ships with rather than to the last tagged one.
  new:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: payday
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: payday/go.mod
          cache: true
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true

      - run: go tool pd new github.com/acme/widget "${GITHUB_WORKSPACE}/widget"
        working-directory: payday

      # Exactly what `pd new` prints, and in that order. There is no
      # `buf dep update` here: it compiles the workspace before writing the
      # lock, and the workspace does not compile until `pd gen` has copied
      # payday's entities in -- so `pd gen` owns it.
      - name: as an app would be set up
        working-directory: widget
        run: |
          go mod edit -replace github.com/lesomnus/payday="${GITHUB_WORKSPACE}/payday"
          while read -r t; do go get -tool "$t"; done <<'EOF'
          github.com/lesomnus/payday/cmd/pd
          google.golang.org/protobuf/cmd/protoc-gen-go
          google.golang.org/grpc/cmd/protoc-gen-go-grpc
          github.com/protobuf-orm/protobuf-merge
          github.com/protobuf-orm/protoc-gen-orm-service
          github.com/protobuf-orm/protoc-gen-orm-go
          github.com/protobuf-orm/protoc-gen-orm-ent
          github.com/lesomnus/payday/cmd/protoc-gen-pd
          github.com/protobuf-orm/ent/cmd/ent
          EOF
          go mod tidy -e

      - name: and generated
        working-directory: widget
        run: |
          go tool pd doctor .
          go tool pd gen . > gen.log 2>&1 || { cat gen.log; exit 1; }
          cat gen.log
          # What `pd new` writes generates with nothing to warn about: an app
          # starts from it, and a warning in a fresh app is one every app has.
          if grep -q '^protoc-gen-pd:' gen.log; then echo 'a fresh app is warned about' >&2; exit 1; fi
          rm gen.log
          go mod tidy
          go build ./...

      # And that it is still on payday's toolchain, which is the line `pd new`
      # wrote: nothing above writes one, and `go get -tool` takes out one that
      # is no newer than the go line it raises. Without it the app's own CI
      # builds with exactly what its go line names (payday#189).
      - name: on payday's toolchain
        working-directory: widget
        run: |
          want="$(go mod edit -json "${GITHUB_WORKSPACE}/payday/go.mod" | jq -er .Toolchain)"
          have="$(go mod edit -json | jq -r '.Toolchain // "none"')"
          test "${have}" = "${want}" || { echo "the app is on toolchain ${have}, and payday on ${want}" >&2; exit 1; }

      # And that a second run writes what the first did, which is the promise
      # `pd gen --check` makes to every app.
      - run: go tool pd gen --check .
        working-directory: widget

      # An archive is kept with a key (payday#115). `init` gives a deployment
      # that names an archive and no key one of its own, beside the archive,
      # says where, and writes over none; and the process is refused until the
      # key is named, with how to make one.
      - name: and its first key
        working-directory: widget
        run: |
          d="${RUNNER_TEMP}/widget-key"
          mkdir -p "$d"
          export WIDGET_AUDIT_ARCHIVE="$d/audit"
          export WIDGET_DB_DSN="file:$d/widget.db?_pragma=foreign_keys(1)"
          key="$d/audit-checkpoints.pem"
          go build -o "$d/widget" ./cmd/widget

          "$d/widget" init | tee "$d/init.log"
          grep -qF "$key" "$d/init.log"
          grep -q 'BEGIN PRIVATE KEY' "$key"
          test "$(stat -c %a "$key")" = 600
          was=$(sha256sum "$key")

          if "$d/widget" init --tenant another > "$d/again.log" 2>&1; then echo 'a second init wrote over the key' >&2; exit 1; fi
          grep -q 'is one already' "$d/again.log" || { cat "$d/again.log"; exit 1; }
          test "$(sha256sum "$key")" = "$was"

          if timeout 30 "$d/widget" serve > "$d/serve.log" 2>&1; then echo 'an archive with no key came up' >&2; exit 1; fi
          grep -q 'audit.checkpoints.key' "$d/serve.log" || { cat "$d/serve.log"; exit 1; }
          grep -q 'openssl genpkey' "$d/serve.log" || { cat "$d/serve.log"; exit 1; }

          # Named, it comes up: still serving when it is stopped.
          code=0
          WIDGET_AUDIT_CHECKPOINTS_KEY="$key" timeout 10 "$d/widget" serve > "$d/up.log" 2>&1 || code=$?
          test "$code" = 124 || { cat "$d/up.log"; exit 1; }

      # And that what it wrote is formatted. An app starts its life with
      # whatever `pd new` put in it, so a template that is not gofmt-clean makes
      # every scaffold fail its own first format check -- which was true of the
      # import block in `cmd/serve.go` until roster ran gofmt over a fresh one.
      - name: and formatted
        working-directory: widget
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The page the template ships, built the way somebody who ran `pd new`
      # would build it -- and against **this** checkout rather than the last
      # published package, which is the same reason the Go half is replaced
      # above. Packed rather than linked: a linked package resolves its own
      # imports from its own directory, so `react` -- an optional peer -- looks
      # absent and the bundler stubs it out. An install is what an app has.
      - name: and the page it ships
        run: |
          cd payday/ts && npm ci && npm pack --pack-destination "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}/widget/ts"
          npm install --save "${GITHUB_WORKSPACE}"/lesomnus-payday-*.tgz
          cd .. && go tool pd gen --ts .
          cd ts && npm run build

      # And what its store leaves on a browser somebody used before: opening
      # a caller's store deletes every other caller's mirror. The build says
      # the page compiles and no more, so this runs the page's own `open` on
      # fake-indexeddb, with a test runner installed for it alone -- at the
      # versions payday's own page tests run with.
      - name: and the mirrors it leaves
        working-directory: widget/ts
        run: |
          dev() { node -p "require('${GITHUB_WORKSPACE}/payday/internal/apptest/ts/package.json').devDependencies['$1']"; }
          npm install --no-save "vitest@$(dev vitest)" "fake-indexeddb@$(dev fake-indexeddb)"
          cp "${GITHUB_WORKSPACE}/payday/.github/scaffold/store.test.ts" .
          npx vitest run store.test.ts

      # Compile the rendered template against the pair sandbox init prints.
      # Building apptest alone cannot catch stale APIs in the sandbox template.
      - name: and its sandbox
        working-directory: widget
        run: |
          go tool pd sandbox init .
          go get github.com/lesomnus/grpc-dgram@latest
          go mod tidy
          mkdir -p ts/public
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ts/public/
          GOOS=js GOARCH=wasm go build -tags grpcnotrace -o ts/public/app.wasm ./wasm

  # The oldest versions payday holds a page to (`pd versions`), proved: the app
  # `pd new` writes, with every package with a floor written down at exactly
  # its floor and installed from nothing, on the oldest Node, generated and
  # built. So a floor is a version payday has built with and not a guess --
  # the first run found one that was never published. Then the same page from
  # below four of them, which `pd upgrade` has to bring back to their floors.
  floor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: payday
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: payday/go.mod
          cache: true
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: go tool pd new github.com/acme/widget "${GITHUB_WORKSPACE}/widget"
        working-directory: payday

      - name: as an app would be set up
        working-directory: widget
        run: |
          go mod edit -replace github.com/lesomnus/payday="${GITHUB_WORKSPACE}/payday"
          while read -r t; do go get -tool "$t"; done <<'EOF'
          github.com/lesomnus/payday/cmd/pd
          google.golang.org/protobuf/cmd/protoc-gen-go
          google.golang.org/grpc/cmd/protoc-gen-go-grpc
          github.com/protobuf-orm/protobuf-merge
          github.com/protobuf-orm/protoc-gen-orm-service
          github.com/protobuf-orm/protoc-gen-orm-go
          github.com/protobuf-orm/protoc-gen-orm-ent
          github.com/lesomnus/payday/cmd/protoc-gen-pd
          github.com/protobuf-orm/ent/cmd/ent
          EOF
          go mod tidy -e
          go tool pd gen .
          go mod tidy

      - name: at its floors
        working-directory: widget/ts
        run: |
          go tool pd versions --json .. > "${RUNNER_TEMP}/floors.json"
          jq --slurpfile f "${RUNNER_TEMP}/floors.json" \
            'reduce ($f[0][] | select(.section != null)) as $v (.; .[$v.section][$v.name] = $v.floor)' \
            package.json > "${RUNNER_TEMP}/package.json"
          mv "${RUNNER_TEMP}/package.json" package.json
          npm install
          go tool pd versions ..
          (cd .. && go tool pd gen --ts .)
          npm run build

      # Below four floors. TypeScript and Vite, each still in its floor's
      # major, so `pd upgrade` moves them to ^floor and not to the next major
      # `pd new` writes. And the protobuf runtime and its generator, which are
      # in two sections and name each other's release exactly, so it has to
      # resolve them as one: they come out at one release or not at all. Then
      # the moved generator writes the page, which is held to its floor by its
      # own package, and the page builds.
      - name: and from below them
        working-directory: widget/ts
        run: |
          npm pkg set 'dependencies[@bufbuild/protobuf]=2.10.0' 'devDependencies[@bufbuild/protoc-gen-es]=2.10.0' \
            'devDependencies[typescript]=5.8.3' 'devDependencies[vite]=7.0.0'
          npm install
          (cd .. && go tool pd upgrade .)
          go tool pd versions ..
          if go tool pd versions --json .. | jq -e '.[] | select(.below)' > /dev/null; then
            echo 'pd upgrade left the page below a floor' >&2
            exit 1
          fi
          v() { jq -r .version "node_modules/$1/package.json"; }
          case "$(v typescript) $(v vite)" in
            5.*' '7.*) ;;
            *) echo "pd upgrade moved typescript to $(v typescript) and vite to $(v vite), out of their majors" >&2; exit 1 ;;
          esac
          if [ "$(v @bufbuild/protobuf)" != "$(v @bufbuild/protoc-gen-es)" ]; then
            echo "pd upgrade left the runtime at $(v @bufbuild/protobuf) and its generator at $(v @bufbuild/protoc-gen-es)" >&2
            exit 1
          fi
          (cd .. && go tool pd gen --ts .)
          npm run build

  # The TypeScript, twice: payday's own half, and the app's -- which is where
  # the two halves are checked against each other. That job starts the real
  # server and sends it bytes, so it needs Go as well; a mock would agree with
  # whatever the TypeScript believes, which is the one thing not worth checking.
  ts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
        working-directory: ts
      - run: npm run check
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: npm run build
        working-directory: ts

      - run: npm ci
        working-directory: internal/apptest/ts
      - run: npm run check
        working-directory: internal/apptest/ts
      - run: npm test
        working-directory: internal/apptest/ts

      # The sandbox, in a browser. `GOOS=js GOARCH=wasm go build` above says the
      # runtime assumes no file system; this says the thing it builds runs.
      #
      # It is worth its minute. The first time this was loaded in a page, three
      # things were wrong -- no broker named, nothing seeded, no interceptors --
      # and every one of them compiled, linked and started. A main that is built
      # and never run says nothing at all.
      - name: and the sandbox it compiles to
        working-directory: internal/apptest/ts
        run: |
          npm run wasm
          npx playwright install --with-deps chromium
          npm run test:sandbox

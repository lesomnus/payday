# What an app's generation looks like, run against the app payday is tried
# against. `strategy: all` on every plugin is not a preference: the default
# runs a plugin once per directory, and an entity whose tenant is declared in
# another one is then not a generation target when its own file is read.
version: v2
inputs:
  - directory: internal/apptest/proto
plugins:
  - local: [go, tool, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: .gen
    opt:
      - module=github.com/lesomnus/payday/internal/apptest
      - default_api_level=API_OPAQUE
    strategy: all
  - local: [go, tool, google.golang.org/grpc/cmd/protoc-gen-go-grpc]
    out: .gen
    opt:
      - module=github.com/lesomnus/payday/internal/apptest
    strategy: all
  - local: [go, tool, github.com/protobuf-orm/protoc-gen-orm-go]
    out: .gen
    opt:
      - module=github.com/lesomnus/payday/internal/apptest
      - query.namer={{ .Name }}.g.go
      - store.name=store.g.go
    strategy: all
  - local: [go, tool, github.com/protobuf-orm/protoc-gen-orm-ent]
    out: .gen
    opt:
      - module=github.com/lesomnus/payday/internal/apptest
      - schema.namer=ent/schema/{{ .Name }}.go
      - ent.namer=ent/{{ .Name }}.g.go
      - server.namer=server/bare/{{ .Name }}.g.go
      - store.name=server/bare/store.g.go
    strategy: all
  - local: [go, tool, github.com/lesomnus/payday/cmd/protoc-gen-pd]
    out: .gen
    opt:
      - module=github.com/lesomnus/payday/internal/apptest
      - ent=ent
      - bare=server/bare
      - out=server/pd
    strategy: all

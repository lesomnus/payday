edition = "2023";

package payday;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// Audit is one write that happened, and who made it.
//
// A row is written for every request that changed something, **inside the
// transaction that changed it**, so the trail and the data it is about hold or
// fall together. Nothing writes one by hand: the RPCs exist so that a test can
// arrange a trail and read it back, and a deployment refuses the ones that
// write -- a trail somebody can edit is evidence of nothing.
//
// # Where its fields are
//
// 1, 2, 4..7 and 13..15 are payday's on every entity it ships, and this one
// leaves almost all of them **empty**: 4..7 are the header -- the alias, the
// name, the description and the labels that anything can read off a row it has
// no type for. A trail row has none of those and never will, so the numbers
// stay reserved rather than being spent on something else.
//
// 3 is not payday's. It is left open **for the app**, for a set smaller than a
// tenant -- a site, a cell, a region -- and payday will not spend it. See
// `docs/SCHEMA.md` §2.1 for what to put there and how to narrow reads by it.
//
// Its own fields are in 8..12, which is where an app's would be. That is not a
// special rule: `CheckOverlay` derives what payday owns from what payday
// declared, so an `audit.ext.proto` is refused at whichever numbers this file
// actually uses. What is left for an app here is 16 and up -- and there is less
// reason than usual to want any, since a column here is a column on the one
// table that never stops growing.
message Audit {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // The tenant the caller was held by, which is who this was done on behalf of.
  //
  // It is a column and not an edge, which is the one place in payday's own
  // schema that is true, and it is on purpose: **the trail has to outlive the
  // tenant it points at**. An edge is a foreign key, and a foreign key would
  // mean either that a tenant can never be erased or that erasing one erases
  // the record of what was done in it. Neither is what a trail is for.
  //
  // The wall reads this column directly; see `tenanted: {field: ...}` below.
  //
  // It is the tenant of the *actor* and not of the thing that changed. So the
  // trail is the actor's: a row is stamped with who was acting and nothing
  // moves it, which means something transferred to another tenant leaves its
  // whole trail behind -- receiving something does not come with the right to
  // read what its previous owner did inside their own walls.
  bytes tenant_id = 2 [(orm.field) = {type: TYPE_UUID}];

  // The holder that made the request, and the zero identifier for a write
  // nobody asked for -- what a deployment does to itself before it serves
  // anything.
  bytes actor_id = 8 [(orm.field) = {type: TYPE_UUID}];

  // The trace the request belonged to, empty if it was not traced. Sixteen
  // bytes as OpenTelemetry spells one, which is not a UUID however alike they
  // look, so it is stored as what it is.
  bytes trace_id = 9;

  // The RPC that did it, by the name gRPC knows it by, such as
  // "/app.RobotService/Rename".
  //
  // It is what the *caller* asked for and not the leg of it that wrote: one
  // call writes through several servers, and an RPC written by hand ends in an
  // Apply nobody called by that name. "Who renamed this" has to answer with
  // Rename.
  string action = 10;

  // What changed, by its identifier. That is the whole of what "the history of
  // this thing" is asked with.
  //
  // Which *kind* of thing it was is not a column, and with payday it does not
  // need to be: an identifier carries its domain, so a row erased later still
  // says what it used to be. That was the standing cost of naming a row by an
  // identifier alone, and it is what `pdid` was for.
  bytes object_id = 11 [(orm.field) = {type: TYPE_UUID}];

  // The patch document the write was compiled from, as it was marshaled, and
  // empty for a write that was not one -- an Add or an Erase says everything it
  // did in `action` and `object_id`.
  //
  // Stored as bytes rather than read back as a document, because that is what a
  // trail is for: written once, read by somebody asking what happened, and
  // whoever asks can unmarshal it.
  bytes patch = 12;

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "object"
        refs: [
          {
            name: "object_id"
            number: 11
          }
        ]
      },
      // The trail as it is read: one tenant's, newest first. Without it the
      // only read there is scans the one table that never stops growing and
      // sorts what it finds.
      {
        name: "trail"
        refs: [
          {
            name: "tenant_id"
            number: 2
          },
          {
            name: "date_created"
            number: 15
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 3
    tenanted: {field: "tenant_id"}
  };
}

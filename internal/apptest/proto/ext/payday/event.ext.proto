// What this app adds to payday's Event, which it has because it declares a
// past (`app/robot.proto`).
//
// It is the overlay an app adopting its own events into payday's table writes
// first: the sentence each of its events used to keep, in a field of its own --
// not in `desc`, which is the sentence an event is said in as it is read, and
// is in no column. Rows written before the adoption keep theirs; payday's own
// events keep none, and say one when they are read. Not personal: a sentence
// of an event names people by a mark and an identifier, never by a name.
message Event {
  string said = 17 [(payday.field) = {personal: false}];
}

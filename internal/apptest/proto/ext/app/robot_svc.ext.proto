edition = "2023";

package app;

import "app/robot.proto";
import "payday.proto";

option go_package = "github.com/lesomnus/payday/internal/apptest";

// What this app adds to the generated contract of a Robot.
//
// It is here because payday says an app writes exactly this and nothing else:
// the CRUD is generated, the general writes are closed, and an operation that
// means something is a real RPC with a real rule. Until now nothing in this
// repository demonstrated that -- the path was written up in the schema guide
// and the only place it existed whole was an app built on payday elsewhere.
//
// It is an overlay rather than a file of its own because of the request below:
// `RobotRef` and `CellRef` do not exist until the contract is generated, and an
// RPC that names a row the way every other RPC names one has to be merged into
// the place those names live. Neither is imported -- this file is merged **into**
// the one that declares them, so importing it would be importing itself.
service RobotService {
  // Move puts a robot in another cell.
  //
  // # Why it cannot be a Patch
  //
  // `Robot.cell` is mutable and nullable, so `Patch` could set it -- which is
  // exactly why `Patch` and `Apply` are closed at the transport. A general
  // write sets any field the schema has, so a rule attached to one field is a
  // rule it walks past. This is where the rule lives, and closing the general
  // writes is what makes it the only door.
  //
  // # What the cell is
  //
  // Field 3, which in payday is the set a row is in -- the second narrowing,
  // under the tenant. So this is not an ordinary field write: it moves a row
  // between the groups a caller's grant is written in terms of, and after it
  // the same caller may no longer be able to read the row it just moved. That
  // is the whole reason it is worth being an operation somebody can point at.
  rpc Move(RobotMoveRequest) returns (Robot) {
    // Moving a robot between operating cells requires the person to call directly.
    option (payday.method) = {direct: {}};
  }

  // Seal, Reading, Job and Joint are here for their names. Each is called what
  // another entity of this app is called, and every type a layer writes around
  // this service embeds the layer's struct beside it -- a struct that has a
  // method for every entity. Go promotes neither of two methods of one name at
  // one depth, so an app whose RPC was called what one of its entities is
  // called had a server that did not compile, in a file `pd gen` owns. One of
  // each shape a method has, since each is written differently.
  //
  // What they do is read the robot named, through the wall, and answer it: the
  // claim is about what reaches them and what refuses them, not about acts.
  // Direct, like Move, so that the gate has a rule of its own for them.
  rpc Seal(RobotRef) returns (Robot) {
    option (payday.method) = {direct: {}};
  }
  rpc Reading(RobotRef) returns (stream Robot) {
    option (payday.method) = {direct: {}};
  }
  rpc Job(stream RobotRef) returns (RobotJobResponse) {
    option (payday.method) = {direct: {}};
  }
  rpc Joint(stream RobotRef) returns (stream Robot) {
    option (payday.method) = {direct: {}};
  }

  // Survey answers the robot named inside an answer of its own: two messages
  // deep, and in each way a message holds another -- a list, a map's values,
  // a oneof's case, and a message that holds itself. It is here for the
  // Secret layer, which clears what an answer can hold wherever it holds it:
  // the robot is read below the layer, secret and all, and none of the
  // copies leaves with it.
  rpc Survey(RobotRef) returns (RobotSurvey) {
    option (payday.method) = {direct: {}};
  }
}

// RobotSurvey holds the robot a `Survey` was asked of, in every place it can.
message RobotSurvey {
  RobotSurveyCell cell = 1;
  repeated RobotSurveyCell cells = 2;
  map<string, RobotSurveyCell> by_alias = 3;
  oneof found {
    RobotSurveyCell first = 4;
    string none = 5;
  }
}

// RobotSurveyCell is one place a robot is held: itself, in a list, and in a
// cell inside this one.
message RobotSurveyCell {
  Robot robot = 1;
  repeated Robot robots = 2;
  repeated RobotSurveyCell within = 3;
}

// RobotJobResponse is every robot a `Job` was sent, in the order it was sent
// them.
message RobotJobResponse {
  repeated Robot items = 1;
}

message RobotMoveRequest {
  // The robot, named the way anything else names one. It is read through the
  // wall, so a caller who cannot see it is told NotFound rather than refused --
  // that it exists is itself something not to say.
  RobotRef ref = 1;

  // Where it goes, and null is a legitimate answer: `Robot.cell` is nullable,
  // so taking a robot out of every cell is a move like any other.
  //
  // Whether the caller may name this cell is the whole of the rule, and it is
  // not a predicate: the row has not moved yet, so there is nothing to narrow.
  // It is read through the wall for the same reason the robot is.
  CellRef to = 2;
}

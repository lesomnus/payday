edition = "2023";

package app;

import "app/payday/tenant.proto";
import "shared/thing.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// This package is the app's own, which is where payday's entities are copied
// to. It is said out loud because this app has a second package -- see
// `shared/thing.proto` -- and payday will not guess between them.
option (payday.app) = {};

// Cell was added to answer one question: what does adding an entity cost?
// Nothing below this line is Go, and nothing else in this app was touched.
message Cell {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string alias = 4;

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 10
  };
}

// Robot is an ordinary entity: it belongs to a tenant, and is read only by
// callers who may see that tenant.
message Robot {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // An edge to an entity in **another package**, which is the shape a filter
  // has to write a qualified name for.
  shared.Thing thing = 30 [(orm.edge) = {nullable: true}];

  // Field 3 is the app's, and this is what putting something there means: a set
  // smaller than a tenant, and a second axis every read of this entity is
  // narrowed by. payday fixes the number and the shape -- an edge, one of them,
  // to an entity inside the wall -- and the name is this app's to choose.
  //
  // It is here so that the generated `pd.Grouped` is compiled and run rather
  // than only written.
  //
  // Nullable, which is the case worth having in the app payday tests itself
  // against: a schema gains field 3 after there are rows, and requiring it
  // would mean no app could ever add one. A row in no set is then invisible to
  // a read narrowed to one -- fail-closed, and surprising enough to be pinned
  // by a test.
  Cell cell = 3 [(orm.edge) = {nullable: true}];

  string alias = 4;

  // A secret this robot proves itself with, and the reason it is here is the
  // declaration rather than the robot: `(payday.field).secret` says a field is
  // written and never answered with, and `pd.Secret` is the layer that makes
  // that true.
  //
  // What it is for in a real schema is a password hash or an API key hash --
  // rows an app reads itself and must never hand out. There was no way to say
  // so until this option existed, so apps said it at registration by leaving a
  // whole service off their server, which is a heavier hammer said in the wrong
  // place.
  // A default, because most robots have none -- and without one this is a NOT
  // NULL column that every `Add` omitting it fails against, on PostgreSQL and
  // not on SQLite. Which is what happened: adding this field broke sixty-six
  // tests that only ran on the permissive one.
  bytes secret = 8 [
    (orm.field) = {default: ""},
    (payday.field) = {secret: true}
  ];

  // Stamped on every write and refused to a patch document, so it is a version
  // and not a field. It is here because this entity declares a `watch:`, and
  // the generator refuses one without it: a watch sends state, so a client
  // replaces what it holds, and two answers about one row can arrive out of
  // order.
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      // The order a List reads in. Without it a page scans the table and sorts
      // what it finds, which is a cost on the one table that grows -- and it is
      // here because the generator asked for it by name.
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        name: "slug"
        refs: [
          {
            name: "alias"
            number: 4
          },
          {
            name: "tenant"
            number: 2
          }
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 7
    list: {
      order: [
        {field: {name: "date_created"}},
        {field: {name: "id"}}
      ]
      with: [{name: "tenant"}]
      // `thing` is an edge to an entity in **another package**, which is what
      // makes this a test: the filter has to name `shared.ThingRef` and not
      // `ThingRef`, which would not resolve from here.
      by: [{name: "ref"}, {name: "tenant"}, {name: "thing"}]
      size: 50
      max: 100
    }
    watch: {}
  };
}

// Joint reaches its tenant through the Robot it is part of, which is what a
// `via` of more than one step is for. Nothing else about it is interesting.
// Pairing is two robots that work together, and the entity `agrees:` is for.
//
// It reaches its tenant through `lead`, which is the ordinary declaration. What
// is not ordinary is `follow`: a second edge that also arrives at a tenant, and
// payday says nothing about such an edge unless it is named -- its own trail
// holds two tenants on purpose, so there is no rule that they agree.
//
// This one names it, because a pairing across two tenants is not a thing this
// app means -- and `agrees:` is a **comparison**, which is what the gate is
// not. The gate asks "may this caller see it" of every edge now, `follow`
// included; that is not the same question. An operator whose scope covers
// several tenants passes it with one robot in each, and the deployment writing
// through the server with no wall passes it without being asked. Only `agrees:`
// says the two are the same tenant.
//
// The sentence here used to be that the gate *never looks at `follow`*, which
// was true and was a hole: an edge is a read, so one pointing out of the
// caller's scope is a way through the wall a `Select` later. See `emitAdmit`.
message Pairing {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Robot lead = 2 [(orm.edge) = {immutable: true}];
  Robot follow = 8 [(orm.edge) = {immutable: true}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    erase: {hard: {}}
    domain: 12
    tenanted: {via: "lead.tenant", agrees: ["follow.tenant"]}
  };
}

message Joint {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // **Nullable**, which is the interesting part after all.
  //
  // A `via` path whose first hop may be absent is the shape payday asks apps
  // for -- a field-3 edge has to be nullable, since a schema gains one after it
  // already has rows -- and it is the shape that broke the trail: the recorder
  // walked the path to find the tenant, found no edge, and failed the **write**
  // from inside itself. A row that named no next hop could not be created at
  // all.
  Robot robot = 2 [(orm.edge) = {immutable: true, nullable: true}];
  string alias = 4;

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 8
    tenanted: {via: "robot.tenant"}
  };
}

// Fleet is shared by the whole deployment, and says so. A reader of the schema
// can tell that from "somebody forgot" because there is no way to forget.
message Fleet {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  string alias = 4 [(orm.field) = {unique: true}];

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 9
    global: {}
  };
}

// Reading is an entity nobody names.
//
// It is here as evidence rather than as a feature: a resource that has no name
// a person writes is an ordinary thing to have -- a measurement, a sample, a
// row of a log -- and payday's answer is that it simply does not declare the
// field. There is no switch to set and nothing to turn off; `alias` is found by
// name, so an entity without one gets no naming, no folding and no slug.
message Reading {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Robot robot = 2 [(orm.edge) = {immutable: true}];

  // The tenant `robot.tenant` reaches, kept here. payday stamps it.
  //
  // A reading is the entity that makes this worth having: readings arrive
  // faster than anybody reads them, and without a stamp every read of one is
  // `HasRobotWith(robot.TenantIDIn(...))` -- a correlated subquery on the table
  // that grows fastest. With it the wall is the comparison a direct edge gets.
  //
  // It is not a second answer to be kept in step. `robot` is immutable and so
  // is `Robot.tenant`, so the value is decided when the row is written and
  // nothing can move it afterwards -- which is what `pd gen` refuses a stamp
  // without.
  bytes tenant_id = 9 [(orm.field) = {type: TYPE_UUID}];

  double celsius = 8;

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      // The stamp leads, which is what makes it worth keeping: the wall on this
      // entity is `tenant_id IN (...)`, and a predicate on the first column of
      // an index is answered by it. Third would satisfy nothing.
      //
      // `date_created` after it because a reading is read by tenant and in
      // time, which is one index rather than two.
      {
        name: "wall"
        refs: [
          {name: "tenant_id", number: 9},
          {name: "date_created", number: 15}
        ]
      }
    ]
  };
  option (payday.entity) = {

    // Hard, and it is the case the option exists for: readings arrive faster
    // than anybody reads them, so a table nothing may ever be removed from is
    // not one this entity can be.
    erase: {hard: {}}
    domain: 11
    tenanted: {via: "robot.tenant", stamp: "tenant_id"}
  };
}

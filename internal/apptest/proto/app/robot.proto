edition = "2023";

package app;

import "payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// Cell was added to answer one question: what does adding an entity cost?
// Nothing below this line is Go, and nothing else in this app was touched.
message Cell {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string alias = 4;

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 10
  };
}

// Robot is an ordinary entity: it belongs to a tenant, and is read only by
// callers who may see that tenant.
message Robot {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Field 3 is the app's, and this is what putting something there means: a set
  // smaller than a tenant, and a second axis every read of this entity is
  // narrowed by. payday fixes the number and the shape -- an edge, one of them,
  // to an entity inside the wall -- and the name is this app's to choose.
  //
  // It is here so that the generated `pd.Grouped` is compiled and run rather
  // than only written.
  //
  // Nullable, which is the case worth having in the app payday tests itself
  // against: a schema gains field 3 after there are rows, and requiring it
  // would mean no app could ever add one. A row in no set is then invisible to
  // a read narrowed to one -- fail-closed, and surprising enough to be pinned
  // by a test.
  Cell cell = 3 [(orm.edge) = {nullable: true}];

  string alias = 4;

  // Stamped on every write and refused to a patch document, so it is a version
  // and not a field. It is here because this entity declares a `watch:`, and
  // the generator refuses one without it: a watch sends state, so a client
  // replaces what it holds, and two answers about one row can arrive out of
  // order.
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      // The order a List reads in. Without it a page scans the table and sorts
      // what it finds, which is a cost on the one table that grows -- and it is
      // here because the generator asked for it by name.
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        name: "slug"
        refs: [
          {
            name: "alias"
            number: 4
          },
          {
            name: "tenant"
            number: 2
          }
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 7
    list: {
      order: [
        {field: "date_created"},
        {field: "id"}
      ]
      with: ["tenant"]
      by: ["ref"]
      size: 50
      max: 100
    }
    watch: {}
  };
}

// Joint reaches its tenant through the Robot it is part of, which is what a
// `via` of more than one step is for. Nothing else about it is interesting.
message Joint {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // **Nullable**, which is the interesting part after all.
  //
  // A `via` path whose first hop may be absent is the shape payday asks apps
  // for -- a field-3 edge has to be nullable, since a schema gains one after it
  // already has rows -- and it is the shape that broke the trail: the recorder
  // walked the path to find the tenant, found no edge, and failed the **write**
  // from inside itself. A row that named no next hop could not be created at
  // all.
  Robot robot = 2 [(orm.edge) = {immutable: true, nullable: true}];
  string alias = 4;

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 8
    tenanted: {via: "robot.tenant"}
  };
}

// Fleet is shared by the whole deployment, and says so. A reader of the schema
// can tell that from "somebody forgot" because there is no way to forget.
message Fleet {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  string alias = 4 [(orm.field) = {unique: true}];

  // Erased softly, which is what saying nothing means: the row is stamped and
  // stays, so it cannot be read or changed, its alias comes free again, and the
  // trail can still say what it held.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {
    domain: 9
    global: {}
  };
}

// Reading is an entity nobody names.
//
// It is here as evidence rather than as a feature: a resource that has no name
// a person writes is an ordinary thing to have -- a measurement, a sample, a
// row of a log -- and payday's answer is that it simply does not declare the
// field. There is no switch to set and nothing to turn off; `alias` is found by
// name, so an entity without one gets no naming, no folding and no slug.
message Reading {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Robot robot = 2 [(orm.edge) = {immutable: true}];

  double celsius = 8;

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {

    // Hard, and it is the case the option exists for: readings arrive faster
    // than anybody reads them, so a table nothing may ever be removed from is
    // not one this entity can be.
    erase: {hard: {}}
    domain: 11
    tenanted: {via: "robot.tenant"}
  };
}

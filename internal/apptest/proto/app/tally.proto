edition = "2023";

package app;

import "app/payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// Tally is a row the app writes through ent alone -- a counter it keeps, a
// record it makes itself -- and so declares no RPC, and records each write as
// the act it is (`trail: {recorded: {}}`, `pd.Record`): a check of the rows
// reads it as it reads any kind (payday#108).
//
// Like `Seal`, it is a test by existing. It is behind the wall and it has a
// secret, which are the two things a layer was written for every entity
// assuming a service: the gate's rule for an Add, and the layer that clears a
// secret on the way out. Either written out for this one names a request type
// that is not there, and the package does not compile. `Pulse` is the other
// answer, a kind kept off the trail.
message Tally {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  uint64 count = 8;

  // Held for the app to read back, and never answered with -- there is no
  // answer to clear it from.
  bytes token = 9 [
    (orm.field) = {type: TYPE_BYTES},
    (payday.field) = {secret: true}
  ];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];

  option (orm.message) = {};
  option (payday.entity) = {
    domain: 15
    erase: {hard: {}}
    trail: {recorded: {}}
  };
}

// Pulse is a row the app writes through ent and keeps off the trail -- a
// heartbeat each process writes, whose every write recorded would be noise --
// and so says so, with why: a check of the rows does not read it, and
// `pd.Record` passes over it (payday#108).
message Pulse {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  string process = 8;
  google.protobuf.Timestamp date_seen = 9 [(orm.field) = {default: ""}];

  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];

  option (orm.message) = {};
  option (payday.entity) = {
    domain: 16
    global: {}
    erase: {hard: {}}
    trail: {off: {why: "a heartbeat each process writes every few seconds; a record of each is noise"}}
  };
}

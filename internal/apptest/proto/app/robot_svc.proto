edition = "2023";
package app;

import "app/robot.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "payday/tenant_svc.proto";

option go_package = "github.com/lesomnus/payday/internal/apptest";

service RobotService {
  // Add creates a new Robot
  rpc Add(RobotAddRequest) returns (Robot);
  // Get retrieves a Robot
  rpc Get(RobotGetRequest) returns (Robot);
  // Patch updates an existing Robot
  rpc Patch(RobotPatchRequest) returns (Robot);
  // Apply applies a patch document to an existing Robot
  rpc Apply(RobotApplyRequest) returns (Robot);
  // Erase deletes a Robot
  rpc Erase(RobotRef) returns (google.protobuf.Empty);
  // List reads Robots a page at a time.
  rpc List(RobotListRequest) returns (RobotListResponse);
}

service JointService {
  // Add creates a new Joint
  rpc Add(JointAddRequest) returns (Joint);
  // Get retrieves a Joint
  rpc Get(JointGetRequest) returns (Joint);
  // Patch updates an existing Joint
  rpc Patch(JointPatchRequest) returns (Joint);
  // Apply applies a patch document to an existing Joint
  rpc Apply(JointApplyRequest) returns (Joint);
  // Erase deletes a Joint
  rpc Erase(JointRef) returns (google.protobuf.Empty);
}

service FleetService {
  // Add creates a new Fleet
  rpc Add(FleetAddRequest) returns (Fleet);
  // Get retrieves a Fleet
  rpc Get(FleetGetRequest) returns (Fleet);
  // Patch updates an existing Fleet
  rpc Patch(FleetPatchRequest) returns (Fleet);
  // Apply applies a patch document to an existing Fleet
  rpc Apply(FleetApplyRequest) returns (Fleet);
  // Erase deletes a Fleet
  rpc Erase(FleetRef) returns (google.protobuf.Empty);
}

service CellService {
  // Add creates a new Cell
  rpc Add(CellAddRequest) returns (Cell);
  // Get retrieves a Cell
  rpc Get(CellGetRequest) returns (Cell);
  // Patch updates an existing Cell
  rpc Patch(CellPatchRequest) returns (Cell);
  // Apply applies a patch document to an existing Cell
  rpc Apply(CellApplyRequest) returns (Cell);
  // Erase deletes a Cell
  rpc Erase(CellRef) returns (google.protobuf.Empty);
}

message RobotAddRequest {
  bytes id = 1;
  payday.TenantRef tenant = 2;
  string alias = 4 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message RobotGetRequest {
  RobotRef ref = 1;
  RobotSelect select = 2;
}

message RobotRef {
  oneof key {
    bytes id = 1;
    RobotRefBySlug slug = 4;
  }
}

message RobotRefBySlug {
  string alias = 4;
  payday.TenantRef tenant = 2;
}

message RobotSelect {
  bool all = 1;
  payday.TenantSelect tenant = 2;
  bool alias = 4;
  bool date_created = 15;
}

message RobotPatchRequest {
  RobotRef ref = 1;
  string alias = 8;
}

message RobotApplyRequest {
  RobotRef ref = 1;
  patch.Patch patch = 2;
}

message RobotListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated RobotFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message RobotListResponse {
  repeated Robot items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message RobotFilter {
  RobotRef ref = 1;
}

message JointAddRequest {
  bytes id = 1;
  RobotRef robot = 2;
  string alias = 4 [features.field_presence = IMPLICIT];
}

message JointGetRequest {
  JointRef ref = 1;
  JointSelect select = 2;
}

message JointRef {
  oneof key {
    bytes id = 1;
  }
}

message JointSelect {
  bool all = 1;
  RobotSelect robot = 2;
  bool alias = 4;
}

message JointPatchRequest {
  JointRef ref = 1;
  string alias = 8;
}

message JointApplyRequest {
  JointRef ref = 1;
  patch.Patch patch = 2;
}

message FleetAddRequest {
  bytes id = 1;
  string alias = 4 [features.field_presence = IMPLICIT];
}

message FleetGetRequest {
  FleetRef ref = 1;
  FleetSelect select = 2;
}

message FleetRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
  }
}

message FleetSelect {
  bool all = 1;
  bool alias = 4;
}

message FleetPatchRequest {
  FleetRef ref = 1;
  string alias = 8;
}

message FleetApplyRequest {
  FleetRef ref = 1;
  patch.Patch patch = 2;
}

message CellAddRequest {
  bytes id = 1;
  payday.TenantRef tenant = 2;
  string alias = 4 [features.field_presence = IMPLICIT];
}

message CellGetRequest {
  CellRef ref = 1;
  CellSelect select = 2;
}

message CellRef {
  oneof key {
    bytes id = 1;
  }
}

message CellSelect {
  bool all = 1;
  payday.TenantSelect tenant = 2;
  bool alias = 4;
}

message CellPatchRequest {
  CellRef ref = 1;
  string alias = 8;
}

message CellApplyRequest {
  CellRef ref = 1;
  patch.Patch patch = 2;
}

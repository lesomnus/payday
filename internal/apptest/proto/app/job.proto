edition = "2023";

package app;

import "app/payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// Job supplies a real application relationship for notification policy: its
// executor, the executor's owner, and its issuer can read the Job topic. The
// framework cannot infer those roles from an arbitrary resource identifier.
message Job {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  bytes robot_id = 8 [(orm.field) = {type: TYPE_UUID}];
  bytes issuer_id = 9 [(orm.field) = {type: TYPE_UUID}];
  bool completed = 10;
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {
    version: {}
  }];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];
  option (orm.message) = {
    rpc: {crud: true}
  };
  option (payday.entity) = {
    domain: 42
    erase: {
      hard: {}
    }
  };
}

edition = "2023";

package app;

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// Profile is a value with no key and no lifecycle of its own: it is written
// and read with the holder that carries it, whole. Declaring no `orm.message`
// is the point -- there is no table, no service and no reference; the field
// that holds one stores it as the canonical protobuf JSON in a single column.
//
// It exists to pin the shape that once failed silently: a message-typed field
// generated an `encoding/json` column, every opaque-API message saw none of
// its own unexported fields, and each value round-tripped as `{}` -- unnoticed
// here because no entity had such a field. This one is it.
//
// Two fields so that both spellings matter: the column holds protojson, which
// writes `displayName` and `howMany`, and a SQL predicate that reaches inside
// must spell them that way -- renaming either field here is a silent migration
// nothing checks.
message Profile {
  string display_name = 1;
  int32 how_many = 2;
}

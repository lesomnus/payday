edition = "2023";

package app;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/internal/apptest";

// NotificationReceiptRecord is created only on the reader's first Mark. Its
// reader identifier is polymorphic: it need not name a Holder.
//
// It is notify's own write and no server's (payday#197). It has no RPC, and
// Mark writes it through the ent client in the transaction it reads its
// notifications in. So no recorder sees it: not the trail's, which `trail:
// off` says, nor the watch's or the outbox's. Mark notes the hint the
// reader's other sessions are owed itself, and it is published once that
// transaction commits.
message NotificationReceiptRecord {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  bytes tenant_id = 2 [(orm.field) = {type: TYPE_UUID}];
  bytes notification_id = 8 [(orm.field) = {type: TYPE_UUID}];
  bytes reader_id = 9 [(orm.field) = {type: TYPE_UUID}];
  google.protobuf.Timestamp date_read = 10 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {
    version: {}
  }];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    indexes: [
      {
        name: "receipt"
        refs: [
          {
            name: "notification_id"
            number: 8
          },
          {
            name: "reader_id"
            number: 9
          }
        ]
        unique: true
      },
      {
        name: "reader"
        refs: [
          {
            name: "tenant_id"
            number: 2
          },
          {
            name: "reader_id"
            number: 9
          },
          {
            name: "notification_id"
            number: 8
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    own: OWN_NOTIFICATION_RECEIPT
    name: "notification-receipt"
    domain: 41
    tenanted: {field: "tenant_id"}
    erase: {
      hard: {}
    }
    trail: {
      off: {why: "a reader's first read of a notification, written once by Mark and never changed: there are as many as there are reads, and a line of the trail for each would keep everybody's reading history for as long as the trail is kept"}
    }
  };
}

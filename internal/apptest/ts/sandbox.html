<!doctype html>
<meta charset="utf-8">
<title>sandbox</title>
<style>
	/*
		The theme is the viewer's. The panel brings its own look and it is a
		dark one -- a devtools surface, like the browser's own -- so a page
		fixed at white put a dark sheet on a white ground and made the reader
		pay for the difference.

		`color-scheme` as well as the colours, because it is what the *browser*
		paints: the scrollbar, the form controls, and the ground behind the
		document before any rule of ours applies.

		The dark ground is a shade under the sheet's own `#161616`, so the sheet
		still reads as the surface above the page.
	*/
	:root {
		color-scheme: light dark;
		--back: #fafafa;
		--ink: #222;
		--dim: #666;
		--line: #ddd;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--back: #0e0e0e;
			--ink: #e6e6e6;
			--dim: #8b8b8b;
			--line: #2c2c2c;
		}
	}

	body { font: 13px/1.5 ui-monospace, monospace; margin: 1rem; background: var(--back); color: var(--ink); }
	pre { margin: 0; white-space: pre-wrap; }
</style>
<pre id="out">…</pre>
<script type="module">
// The page `sandbox.browser.test.ts` drives. It reports on `window.__out`
// rather than only in the console, because a worker's console and the page's
// are two streams and the test reads one thing.
const el = document.getElementById('out')
window.__out = []
window.__done = false
const say = (...v) => { const s = v.join(' '); window.__out.push(s); el.textContent += '\n' + s; console.log(s) }

say('crossOriginIsolated:', String(crossOriginIsolated))
say('SharedArrayBuffer:', typeof SharedArrayBuffer)

try {
	const { start } = await import('/src/sandbox.ts')
	const { app } = await import('/src/client.ts')

	// The count the module arrives with, which is what a page draws a bar
	// from. Only the shape is asserted -- that it rises and lands on the
	// length the response declared -- because the bytes are the build's.
	const seen = []
	const sb = await start('/app.wasm', (loaded, total) => seen.push([loaded, total]))
	say('served')

	const last = seen[seen.length - 1] ?? [0, 0]
	say('progress ticks:', seen.length > 1 ? 'many' : String(seen.length))
	say('progress rises:', String(seen.every((v, i) => i === 0 || v[0] > seen[i - 1][0])))
	say('progress ends full:', String(last[0] === last[1] && last[0] > 0))

	// A client that says who is calling. `start` builds one that does not, so
	// this wraps the transport it answered with -- which is what `transport` is
	// on the Sandbox for. `Plain` believes what it is told, which is right
	// here: there is nobody else in the page to lie to.
	//
	// Wrapping rather than dialing again, and it is not a tidiness. Calling
	// `createDrpcTransport` here would use **this** page's copy of
	// `@lesomnus/grpc-dgram` on a socket opened by the one `@lesomnus/payday`
	// resolved, and in this repository those are two copies -- payday's
	// TypeScript is linked by path. What that cost was a refusal arriving with
	// no status: the wall's `NotFound` read as `Unknown`, and nothing else in
	// the run looked wrong.
	const raw = sb.transport
	const who = (h) => new Headers({ ...Object.fromEntries(new Headers(h)), authorization: 'Plain @acme/admin' })
	const c = app({
		unary: (m, s, t, h, i, o) => raw.unary(m, s, t, who(h), i, o),
		stream: (m, s, t, h, i, o) => raw.stream(m, s, t, who(h), i, o),
	})

	const t = await c.tenant.get({ ref: { key: { case: 'alias', value: 'acme' } } })
	say('tenant:', t.alias)

	const r = await c.robot.add({ tenant: { key: { case: 'id', value: t.id } }, alias: 'arm-01' })
	say('robot:', r.alias)

	say('list:', (await c.robot.list({ filters: [] })).items.length)

	// Calls at once, which a page makes and a process does not. Two things in
	// `wasm/main.go` hold these at eight, and each was found by losing it:
	// without the leading slash in the DSN the second connection reads an
	// empty database of its own, and without `MaxOpenConns: 1` the second
	// writer is told the database is locked. Neither says either of those --
	// what a page sees is `could not say who is calling`.
	const atOnce = async (what, f) => {
		const rs = await Promise.allSettled(Array.from({ length: 8 }, (_, i) => f(i)))
		say(`at once ${what}:`, rs.filter(v => v.status === 'fulfilled').length)
		say(`at once ${what} refused:`, rs.find(v => v.status === 'rejected')?.reason ?? 'nothing')
	}

	await atOnce('read', () => c.robot.list({ filters: [] }))
	await atOnce('write', i => c.robot.add({ tenant: { key: { case: 'id', value: t.id } }, alias: `at-once-${i}` }))

	// The wall, and it is the same answer it gives over HTTP: a row this caller
	// may not see is a row the query did not match.
	try {
		await c.robot.get({ ref: { key: { case: 'id', value: new Uint8Array(16) } } })
		say('wall: a bogus identifier was found')
	} catch (e) {
		say('wall:', String(e).match(/\[(\w+)\]/)?.[1] ?? String(e))
	}

	sb.close()
} catch (e) {
	say('FAILED:', String(e))
	say(String(e?.stack ?? '').split('\n').slice(0, 3).join(' | '))
}
window.__done = true
</script>

edition = "2023";

package payday;

import "orm/ref.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/pdpb";

// Meter is one thing a tenant holds that the app is paid by -- its assets, its
// members, the bytes it stores -- declared in the schema so that `pd gen` can
// hold it to the entity it counts and write the query that counts it
// (payday#186):
//
//	option (payday.app) = {
//	  meters: [
//	    {
//	      key: "acme.robots.running"
//	      unit: "{robot}"
//	      count: {
//	        of: "Robot"
//	        where: [{field: {name: "mode", number: 19}, in: ["MODE_RUN"]}]
//	      }
//	    },
//	    {
//	      key: "acme.attachments.bytes"
//	      unit: "By"
//	      sum: {of: "Attachment", field: {name: "size_bytes", number: 10}}
//	    }
//	  ]
//	};
//
// # Why it is declared rather than queried from outside
//
// The two other ways to get these numbers both fail quietly. A billing service
// that reads the app's database is tied to its schema: a column renamed or a
// status added and it counts the wrong rows, and nothing fails. Monitoring
// metrics are not a billing source: a lost sample cannot be told from a
// doubled one, and nothing can compute them again. A declaration names fields
// the generator resolves -- by number, with the name checked against it -- so
// a field renamed under it, or a value of an enum that is no longer one, is a
// generation that stops rather than a bill that is wrong.
//
// What is measured is what a tenant holds **now**. Something that happens over
// time -- bytes sent, calls made -- has no row to count; the guide gives the
// convention for those (`docs/guide/meters.md`, flows).
//
// # What it measures, and nothing else
//
// The rows of one entity that belong to one tenant, minus the ones that are
// erased, narrowed by `where`: how many of them, or the sum of one of their
// integer fields. A reading the generated query cannot say safely -- a range,
// a pattern, a join, a time window, a byte size -- is a meter the app writes
// itself (`meter.Meter`), beside these. See [Meter.Where] for what a condition
// may be.
message Meter {
  // Key is what a reading of this meter is filed under: lower case words of
  // letters, digits and `_`, joined by dots, and at least two of them -- the
  // app's name first, as a loop's name is: `acme.robots.running`.
  //
  // It is what a billing service prices, so it is chosen once. A meter that
  // comes to count something else is a new key, and the old one stops being
  // read; a key that kept its name and changed what it counts would bill one
  // period by two rules.
  string key = 1;

  // Unit is what a value counts in, as OpenTelemetry writes one (UCUM): `By`
  // for bytes, `{asset}` for a count of assets, `d` for days. Required: a
  // number with no unit is one nobody can price safely.
  string unit = 2;

  // What is measured: one of the two.
  oneof measure {
    // Count is how many rows there are.
    Count count = 3;

    // Sum is the sum of one integer field over them.
    Sum sum = 4;
  }

  // Count is how many rows of an entity a tenant holds.
  message Count {
    // Of is the entity, by its message name in the app's package -- `Robot`
    // -- or by its full name for one in another package.
    string of = 1;

    // Where narrows the rows: all of them must hold. Nothing said is every
    // row the tenant holds.
    repeated Where where = 2;
  }

  // Sum is the sum of one field over the rows of an entity a tenant holds.
  message Sum {
    // Of is the entity, as [Count.of] is.
    string of = 1;

    // Field is the one summed: an integer, by its name and its number.
    //
    // An integer and nothing else, since a bill is whole numbers: a float
    // summed is not exact, and two databases sum one differently. An amount
    // is a whole number of its currency's smallest unit, and a size a whole
    // number of bytes.
    orm.Ref field = 2;

    // Where narrows the rows, as [Count.where] does.
    repeated Where where = 3;
  }

  // Where is one condition a row must hold to be measured: one field of the
  // entity, and exactly one of `in`, `not_in` and `set`.
  //
  //	{field: {name: "mode", number: 19}, in: ["MODE_RUN", "MODE_SERVICE"]}
  //	{field: {name: "role", number: 8}, not_in: ["guest"]}
  //	{field: {name: "date_disposed", number: 17}, set: false}
  //
  // # Only what the generated query can say safely
  //
  // Equality with one of a few values, and whether a value is there at all.
  // Both are the same statement on SQLite and on PostgreSQL, whatever the
  // collation or the zone, and both are typed Go in the generated query -- a
  // value is never text spliced into SQL.
  //
  // What is left out is left out on purpose: a range of numbers or times is a
  // window a meter of what a tenant holds now has no use for; a pattern is
  // matched differently by each database; a field of another entity is a join;
  // and a float compared for equality is a value that is never quite there.
  // Each of those is a meter the app writes (`meter.Meter`), in Go, where the
  // reason for it can be written beside it.
  message Where {
    // Field is the field, or the edge, by its name and its number. Both, and
    // `pd gen` refuses one without the other: the number is what a field is,
    // so a field renamed is still found, and the name has to agree with it,
    // so a meter never follows a rename onto another field that took the old
    // name. A meter that quietly counts another column is a bill that is
    // quietly wrong.
    orm.Ref field = 1;

    // In is the values the field may hold, one of them, written as the text
    // format writes the field's kind: a string as it is, an enum by the name
    // of its value -- which `pd gen` holds to the enum -- a bool as `true` or
    // `false`, an integer in decimal.
    //
    // A string's values are not checked, since nothing in the schema says
    // which a string may hold. A meter counting a closed set of values is
    // better served by an enum, whose values a generation checks.
    repeated string in = 2;

    // NotIn is the values the field may not hold, written as `in`'s are. A
    // field that may be null and is counts: none of these is what it holds.
    repeated string not_in = 3;

    // Set is whether the field holds a value at all -- `set: false` for a row
    // that was never disposed of -- and is said only of a field or an edge
    // that may be null: one that may not always holds one.
    bool set = 4 [features.field_presence = EXPLICIT];
  }
}

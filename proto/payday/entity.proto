edition = "2023";

package payday;

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/pdpb";

// Entity is what payday has to be told about a message that `orm` already
// says is an entity.
//
// Everything here is a thing that cannot be worked out from the schema and that
// **fails quietly when it is left to be worked out later**: what kind of thing
// an identifier names, and whether a row is behind the tenant wall. Both are
// decisions, both are forgettable, and a generator can refuse to generate what
// does not say them -- which is the earliest and cheapest place either can be
// caught.
message Entity {
  // Domain is the number written into the ninth byte of every identifier of
  // this entity. See `pdid`.
  //
  // It is of the same kind as a field number: chosen once, never changed, and
  // never given to something else after the entity that had it is gone. An
  // identifier outlives the row it named -- that is most of the point of
  // carrying the domain at all -- so reusing a number makes an old identifier
  // start lying about what it was.
  //
  // 1..255. Zero is what an identifier nothing registered reads as, so nothing
  // may hold it.
  uint32 domain = 1;

  // Name is what a person writes this domain as, which is the part after `#`
  // of a slug: `@acme/arm-01#robot`.
  //
  // Left out, it is the message name in kebab-case -- `Robot` is `robot`,
  // `WorkCell` is `work-cell`. Write it out when that is not the word the
  // domain is known by.
  string name = 2;

  // Tenancy says whether rows of this entity are behind the tenant wall, and
  // **one of the two must be said**. There is no default, and that is the whole
  // reason this field exists.
  //
  // The alternative -- assume one -- is wrong whichever one is assumed.
  // Assuming an entity is walled makes an entity that is not disappear from
  // every read until somebody notices. Assuming it is not makes an entity that
  // should be walled readable by everybody, and *nobody notices*: nothing fails,
  // no test goes red, and the first sign of it is a caller reading another
  // tenant's rows.
  //
  // So it is neither, and generation stops until it is said. Saying it costs a
  // line; the second mistake costs more than that.
  oneof tenancy {
    // This entity is the tenant. A row of it is visible to a caller who may
    // see that tenant, which from inside one means exactly itself.
    Tenant tenant = 3;

    // Rows of this entity belong to a tenant, reached by an edge or named by a
    // column.
    Tenanted tenanted = 4;

    // Rows of this entity are not behind the wall.
    Global global = 5;
  }

  // List says this entity answers a List, and how. Nothing said is no List
  // RPC at all.
  List list = 6;

  // The three are nested because they are what a tenancy is written as and
  // nothing else -- and because `payday.Tenant` is the entity, which is a
  // different thing entirely.

  // Tenant is the entity a wall is made of. There is one of these in a schema.
  message Tenant {}

  // Tenanted is an entity whose rows belong to a tenant, and are read only by
  // callers who may see that tenant.
  //
  // A row reaches its tenant one of two ways, and both are here because both
  // happen. Most rows hold an edge to one. Some name one without holding an
  // edge -- an audit trail is the reason: it has to outlive the tenant it
  // points at, so there is no foreign key to walk along.
  message Tenanted {
    // Via is the edge that reaches the tenant, and it does not have to be a
    // direct one: `"tenant"` for a row that holds its own, `"holder.tenant"`
    // for a row that reaches it through whatever holds it.
    //
    // Left out with no `field` either, it is `"tenant"`, since that is what the
    // edge is called when there is one.
    string via = 1;

    // Field is the column holding the tenant's identifier, for a row that names
    // one without a foreign key to it.
    //
    // It is not the same thing as `via` written shorter. An edge says the
    // tenant is still there; a column says only what its identifier was. A
    // trail row wants exactly the second: what it records happened, and it goes
    // on being true after the tenant it happened in is gone.
    //
    // Say one or the other, never both.
    string field = 2;
  }

  // Global is an entity that is not behind the wall -- a table the whole
  // deployment shares.
  //
  // It is written out rather than left unsaid so that it is a decision somebody
  // made, and so that a reader of the schema can tell "this is shared" from
  // "somebody forgot".
  message Global {}

  // List is how this entity is read a page at a time.
  //
  // The half of a List that is the same for every entity is the half people get
  // wrong -- a cursor rather than an offset, an order that ends in the key, a
  // size that is capped, one row more read than the page so that "is there
  // another" costs no second query. So it is generated.
  //
  // The half that is the domain is the filter, and only what can be *declared*
  // is generated: equality on a field or a reference. Anything else is an RPC
  // somebody writes, which is where a rule with a reason belongs anyway.
  message List {
    // Order is the columns rows come back in, outermost first.
    //
    // **The last one must be the key.** A cursor cannot tell apart two rows
    // that are equal in every column of the order, so the page after the first
    // of them either repeats the second or skips it -- and rows written by one
    // request are stamped a moment apart at best. Generation refuses an order
    // that does not end in the key.
    //
    // Nothing said is the key alone, which is always correct and is rarely
    // what somebody wants to read.
    repeated Order order = 1;

    // With names edges to read along with each row, since almost everything
    // that reads a list wants to know whose the rows are.
    repeated string with = 2;

    // By names what a filter may be about: a field, compared for equality, or
    // "ref" for the reference that names a row.
    //
    // A filter that cannot be written this way is an RPC somebody writes. That
    // is not a limitation being apologised for: a rule about what a caller may
    // ask has a reason, and a reason belongs beside the code that acts on it
    // rather than in a declaration that can only carry the number.
    repeated string by = 3;

    // Size is how many rows a request that did not say gets, and Max is the
    // most it gets however loudly it asks.
    //
    // Max is required. A page with no cap is an answer with no cap, and the
    // request that finds that out is the one that reads the whole table.
    uint32 size = 4;
    uint32 max = 5;

    // Filters is how many filters one request may carry. Each is a predicate
    // in the same query, so this is what says how much of the database a
    // request may ask to read.
    //
    // Unlike the size it is **refused** rather than clamped: asking for more
    // rows than there are is a caller being generous with themselves, and
    // dropping half the filters would answer a question nobody asked.
    uint32 filters = 6;
  }

  // Order is one column of a list's order.
  message Order {
    string field = 1;

    // Desc reads the list backwards, which is what a trail wants: what it is
    // asked is what happened, and the answer starts with what happened last.
    bool desc = 2;
  }
}

edition = "2023";

package payday;

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/pdpb";

// App says that this file's proto package is the app's own.
//
// # What it is for
//
// payday has to know one package per app: its own entities -- the tenant, the
// holder, the trail, the queue -- are **copied into it**, so that a caller says
// `acme.Tenant` rather than the name of the framework the app was built with,
// and `pd entity add` writes a new entity there.
//
// Ordinarily nothing says which, because there is only one and payday reads it
// off the schema. An app that declares a second package has to say, and this is
// how:
//
//	edition = "2023";
//
//	package acme;
//
//	option (payday.app) = {};
//
// # Why an app would have two
//
// Because a name can be worth more than the app that holds it. A fleet that
// runs several services may want one word for the thing they are all about --
// `hday.oasys.Robot` -- while everything each service keeps for itself stays in
// a package of its own. The shared message is then the same name everywhere it
// is read, and nothing else has to be.
//
// This is presence and nothing else: a file either says it or does not. It is a
// message rather than a `bool` so that something can be added to it later
// without every app that set it having to change.
//
// Setting it on more than one package is refused. Two answers to "where do
// payday's entities go" is the thing this exists to avoid, and getting two of
// them from the option meant to settle it would be worse than getting none.
message App {}

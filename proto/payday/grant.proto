edition = "2023";

package payday;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/payday/pdpb";

// GrantService is what a source of entitlements serves to the apps it decides
// for: a billing service, or anything else that says what a tenant may have
// (payday#185).
//
// # What it is for
//
// A billing service decides what a tenant may have -- a feature, a number of
// something -- and the app enforces it. Asking the service on every call makes
// every write depend on it, and checking a cached answer outside the write's
// transaction lets two concurrent writes both pass a limit of one. So the app
// keeps a copy of its tenants' grants in its own database, read inside the
// transaction of the write it decides (`entitle.Has`, `entitle.Limit`), and
// this is what the copy is made from: `entitle.Follower` watches it, applies
// each grant it hears of, and compares the copy with the whole of it every so
// often.
//
// # Why payday owns the contract
//
// For the reason `TokenService` is payday's: the source and the app are
// different services, and neither is the place for the shape they agree on. A
// source speaks this and every app that sells through it follows it; payday
// depends on no billing service, and a second source is a second
// implementation of the same two calls.
//
// # Whose grants a caller hears of
//
// Its own tenants', and the source says which those are by the caller's
// credential, as a wall narrows a read: there is no field naming an app. A
// field saying whose grants to send would be a second answer beside the one
// that decides.
//
// # What a grant is
//
// One thing a tenant was given, for a window of time: a key, a value, and
// when it begins and ends ([EntitlementGrant]). It is **state, and never a
// delta**: every message about a grant is all of it as it is now, at a
// version, so a grant heard twice is heard once, two heard out of order
// converge on the newer, and a copy that missed some is put right by the next
// one it hears.
//
// So a grant is changed by sending it again at a higher version, and taken
// away by **ending** it: sent again with `valid_until` at the moment it ends.
// A grant the source stops listing that has not ended is kept by the copy
// until it does -- a copy never takes away on a guess, and `valid_until` is
// what bounds how long that is. Once a grant has ended the source may stop
// listing it, after a while -- a day is plenty, so that a comparison begun
// before it ended never finds it gone -- and the copy forgets it at its next
// comparison.
service GrantService {
  // Watch streams each grant whose state changes while the stream is open,
  // as it is after the change.
  //
  // The first message is `ready`, sent once the stream will carry every
  // change from then on; a follower reads the whole of [List] only after it,
  // so that nothing changed between the two is missed. Nothing is replayed
  // and there is no cursor: a stream that ended is one that missed things,
  // and what follows a reconnect is another `ready` and another reading of
  // the list. A source may end a stream whenever it must -- a consumer too
  // slow, a process going down -- and the follower reconnects.
  rpc Watch(GrantWatchRequest) returns (stream GrantWatchResponse);

  // List reads the grants the source holds for the caller's tenants, a page
  // at a time, or one tenant's when `tenant_id` says which: the snapshot a
  // follower compares its copy with.
  rpc List(GrantListRequest) returns (GrantListResponse);
}

// EntitlementGrant is one thing a source gave a tenant, for a window of time:
// a grant, which is what [GrantService] is made of. (`Grant` alone is a
// token's, what a credential allows.)
message EntitlementGrant {
  // Id is the grant's identifier at the source: 1 to 64 bytes, unique among
  // every grant the source holds, and never given to another grant.
  bytes id = 1;

  // TenantId is the tenant it was given to, by the app's identifier of it.
  // A grant's tenant never changes: a grant to somebody else is another grant.
  bytes tenant_id = 2;

  // Key is what it gives: lower case words of letters, digits and `_`, joined
  // by dots, the app's name first -- `acme.export`, `acme.robots` -- as a
  // meter's key is written. Like the tenant, it never changes.
  string key = 3;

  // Version orders the states of this grant: every change to it is a greater
  // one, and a state at a version the copy already holds, or below it, is
  // one it has heard. Never zero.
  //
  // It is compared only between states of one grant. Two grants' versions
  // say nothing about each other.
  uint64 version = 4;

  // Value is what it gives of its key: exactly one of the three.
  oneof value {
    // On is a feature, switched on or off.
    bool on = 5;

    // Limit is how much of something the tenant may hold: a whole number,
    // zero or more. It is all of it while the grant decides the key -- a
    // source that sells a tenant more of something sends the new total, and
    // not the difference.
    int64 limit = 6;

    // Unlimited is no bound at all, which is a value and not the absence of
    // one: a tenant with no grant of a key is entitled to none of it.
    Unlimited unlimited = 7;
  }

  // ValidFrom is when it begins: unset is from the beginning. A grant that
  // begins later is the source saying the future -- next period's plan --
  // which a copy that stops hearing from the source still turns to when it
  // comes.
  google.protobuf.Timestamp valid_from = 8;

  // ValidUntil is when it ends, and every grant says one: a copy that stops
  // hearing from its source keeps a grant until then and not forever, and
  // that is the one bound on how stale a copy can be. A grant meant to last
  // says a horizon and is sent again before it comes -- the end of the paid
  // period and a grace after it, say -- and one meant to last for good says
  // a far one, where somebody reading the source can see it.
  //
  // A grant whose window is empty, ending when or before it begins, is in
  // force never: a grant taken back before it began.
  google.protobuf.Timestamp valid_until = 9;

  // Unlimited is what [EntitlementGrant.unlimited] holds: nothing, since
  // there is nothing to say of it.
  message Unlimited {}
}

message GrantWatchRequest {
  // Nothing: whose grants a caller hears of is the source's to say, by its
  // credential. See [GrantService].
}

message GrantWatchResponse {
  oneof event {
    // Ready is the first message of every stream, and only the first.
    GrantWatchReady ready = 1;

    // Grant is one grant as it is now, after a change.
    EntitlementGrant grant = 2;
  }
}

// GrantWatchReady says a stream will carry every change from now on.
message GrantWatchReady {}

message GrantListRequest {
  // TenantId narrows the list to one tenant's grants, and unset is every
  // tenant's the caller may hear of.
  bytes tenant_id = 1;

  // Size is how many grants a page holds at most: zero is the source's
  // choice, and the source may cap it.
  int32 size = 2;

  // Cursor is the previous response's `next`, and empty for the first page.
  string cursor = 3;
}

message GrantListResponse {
  // Items are the grants of this page, each as it is now: every grant that
  // has not ended, and those that have for as long as the source keeps them
  // -- a day after they end at least -- in an order of the source's that
  // paging does not skip in.
  repeated EntitlementGrant items = 1;

  // Next is the cursor of the page after this one, and empty when this is
  // the last.
  string next = 2;
}

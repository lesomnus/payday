edition = "2023";

package payday;

import "google/protobuf/descriptor.proto";
import "payday/app.proto";
import "payday/entity.proto";
import "payday/past.proto";

option go_package = "github.com/lesomnus/payday/pdpb";

// The numbers are payday's block. `orm` holds 45001 and 45101..45102, so this
// starts a block above it with room to grow in either direction.
extend google.protobuf.MessageOptions {
  Entity entity = 46001;

  // What a message is when it is not an entity but what one kind of the app's
  // events holds (payday#151): `option (payday.event) = {kind: "robot.move"};`.
  // The next number of the message block. See [EventMessage] for what is
  // refused of one.
  EventMessage event = 46002;
}

// The field block, one above the message one for the same reason: room to grow
// without either running into `orm`.
extend google.protobuf.FieldOptions {
  Field field = 46101;
}

// And the file block, above that one. A file says at most one thing to payday
// and it is which package the app's own entities live in -- see [App], and note
// that an app with a single package says nothing at all.
extend google.protobuf.FileOptions {
  App app = 46201;
}
